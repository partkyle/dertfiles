# theseus monitor rules.
#
# DP-1: 4K 240 Hz main display, HDR.
# DP-2: 1440p portrait (270° CCW) at 144 Hz, placed to the right of DP-1.
#
# mango matches the first rule whose fields all match; `name` is a regex, so
# anchor it. Adjust x/y if the physical arrangement differs.

monitorrule=name:^DP-1$,width:3840,height:2160,refresh:240,x:0,y:0,scale:1,hdr:1,hdr_min_lum:0.0001,hdr_max_lum:1000,hdr_max_avg_lum:250
monitorrule=name:^DP-2$,width:2560,height:1440,refresh:144,x:3840,y:0,scale:1
