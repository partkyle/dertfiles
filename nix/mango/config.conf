# Mango (mangowc) main config.
#
# Live-linked into ~/.config/mango by nix/modules/features/mango/nixos.nix. Mango does not
# watch the file, so edits take effect only after `reload_config`
# (Super+r) or `mmsg dispatch reload_config` — no rebuild needed.
#
# Keyword names target the nixpkgs package (0.18.2), which renamed most of the
# 0.17.2 spellings this file used to carry (tagrule → tag_rule, gappih →
# gap_inner_horizontal, keymode → key_mode, windowrule → window_rule, …) and
# renamed rule fields (appid → app_id, isfloating → is_floating, isterm →
# is_term, noanim → no_animation). Values follow the shipped 0.18.2 default
# unless a comment says otherwise. Per-host monitor rules live in host.conf,
# sourced at the bottom.

# ── appearance (0.18.2 defaults) ────────────────────────────────────────
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=0
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadows_color=0x000000ff


animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.9
zoom_end_ratio=1.0
fade_in_begin_opacity=0.7
fade_out_begin_opacity=0.7
animation_duration_move=200
animation_duration_open=200
animation_duration_tag=200
animation_duration_close=150
animation_duration_focus=0
animation_curve_open=0.15,0,0.1,1
animation_curve_move=0.15,0,0.1,1
animation_curve_tag=0.15,0,0.1,1
animation_curve_close=0.15,0,0.1,1
animation_curve_focus=0.15,0,0.1,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.15,0,0.1,1

# Scroller layout
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-stack layout
new_is_master=1
default_master_factor=0.55
default_master_count=1

# Dwindle layout
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Overview
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# Misc
# Ten numbered tags (key 0 is the tenth, as in the Hyprland config). The
# special workspace is a reserved bit, not one of these.
tag_num=10
smart_gaps=0
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=1
focus_direction_only_zone_overlap=1
focus_cross_tag=0
# Super+Shift+h/j/k/l move a window onto the adjacent monitor, like Hyprland.
# focus_cross_monitor above does the same for focus.
exchange_cross_monitor=1
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# Keyboard / input
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us
xkb_rules_options=ctrl:nocaps

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# Mouse
mouse_natural_scrolling=0

# Gaps and borders
gap_inner_horizontal=2
gap_inner_vertical=2
gap_outer_horizontal=2
gap_outer_vertical=2
# The special workspace is an overlay, not a laid-out tag: it should cover the
# whole monitor. Upstream defaults (20px outer / 10px inner) leave the dimmed
# underlying tag visible around it, so drop all four gaps.
special_gap_inner_horizontal=0
special_gap_inner_vertical=0
special_gap_outer_horizontal=0
special_gap_outer_vertical=0
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
root_color=0x201b14ff
border_color=0x45475aff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
focus_color=0x33ccffee
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# ── tags ────────────────────────────────────────────────────────────────
# All ten numbered tags start in the master-stack (right_tile) layout. `dert
# mango layout` switches the focused tag's layout at runtime.
tag_rule=id:1,layout_name:right_tile
tag_rule=id:2,layout_name:right_tile
tag_rule=id:3,layout_name:right_tile
tag_rule=id:4,layout_name:right_tile
tag_rule=id:5,layout_name:right_tile
tag_rule=id:6,layout_name:right_tile
tag_rule=id:7,layout_name:right_tile
tag_rule=id:8,layout_name:right_tile
tag_rule=id:9,layout_name:right_tile
tag_rule=id:10,layout_name:right_tile

# Layouts Super+n cycles through.
circle_layout=dwindle,tile,monocle,scroller

# ── keybindings ─────────────────────────────────────────────────────────
# Super chords drive the focused app's own clipboard/select-all via keyd
# (nix/modules/features/keyd/nixos.nix), so Super+A/X/C/V/T/W never reach the compositor.
# Super+Shift+C is re-asserted by keyd for centerwin.

# reload config
bind=SUPER,r,reload_config

# launcher, terminal, files, browser
bind=SUPER,space,spawn,rofi -show drun -show-icons
bind=SUPER,Return,spawn,ghostty
bind=SUPER,e,spawn,ghostty -e yazi
bind=SUPER,b,spawn,brave

# quit
bind=SUPER+SHIFT,m,quit

# lock screen (same chord as Hyprland; swaylock comes from features/desktop-idle/nixos.nix)
bind=SUPER,Escape,spawn,swaylock

# window state
bind=SUPER,q,killclient
bind=SUPER,g,togglefloating
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,f,togglefakefullscreen
bind=SUPER+SHIFT,c,centerwin

# focus: wm-dir.sh cycles the monocle stack, else focusdir
bind=SUPER,h,spawn_shell,$HOME/.config/mango/scripts/wm-dir.sh focus left
bind=SUPER,j,spawn_shell,$HOME/.config/mango/scripts/wm-dir.sh focus down
bind=SUPER,k,spawn_shell,$HOME/.config/mango/scripts/wm-dir.sh focus up
bind=SUPER,l,spawn_shell,$HOME/.config/mango/scripts/wm-dir.sh focus right
bind=SUPER,Left,spawn_shell,$HOME/.config/mango/scripts/wm-dir.sh focus left
bind=SUPER,Right,spawn_shell,$HOME/.config/mango/scripts/wm-dir.sh focus right
bind=SUPER,Up,spawn_shell,$HOME/.config/mango/scripts/wm-dir.sh focus up
bind=SUPER,Down,spawn_shell,$HOME/.config/mango/scripts/wm-dir.sh focus down

# move window: wm-dir.sh no-ops in monocle, else move_client
bind=SUPER+SHIFT,h,spawn_shell,$HOME/.config/mango/scripts/wm-dir.sh move left
bind=SUPER+SHIFT,j,spawn_shell,$HOME/.config/mango/scripts/wm-dir.sh move down
bind=SUPER+SHIFT,k,spawn_shell,$HOME/.config/mango/scripts/wm-dir.sh move up
bind=SUPER+SHIFT,l,spawn_shell,$HOME/.config/mango/scripts/wm-dir.sh move right
bind=SUPER+SHIFT,Left,spawn_shell,$HOME/.config/mango/scripts/wm-dir.sh move left
bind=SUPER+SHIFT,Right,spawn_shell,$HOME/.config/mango/scripts/wm-dir.sh move right
bind=SUPER+SHIFT,Up,spawn_shell,$HOME/.config/mango/scripts/wm-dir.sh move up
bind=SUPER+SHIFT,Down,spawn_shell,$HOME/.config/mango/scripts/wm-dir.sh move down

# tags 1-9: view, and move the focused window
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# tag 10 on key 0, matching the Hyprland config
bind=SUPER,0,view,10,0
bind=SUPER+SHIFT,0,tag,10,0

# special workspace (mango's tag 0 overlay) — mirrors Hyprland's "magic"
bind=SUPER,grave,toggle_special_tag
# move to/from the overlay and follow the window, like the numbered tag
# moves (tag_special_tag opens the overlay when the window is sent to it)
bind=SUPER+SHIFT,grave,tag_special_tag
bind=SUPER+SHIFT,i,restore_minimized

# layouts: quick switches go through dert for a consistent CLI path; the bar
# reads the mode back from the compositor, so nothing else needs to record it
bind=SUPER,m,spawn_shell,$HOME/.local/bin/dert mango layout monocle
bind=SUPER,comma,spawn_shell,$HOME/.local/bin/dert mango layout dwindle
bind=SUPER,period,spawn_shell,$HOME/.local/bin/dert mango layout right_tile
bind=SUPER,slash,spawn_shell,$HOME/.local/bin/dert mango layout scroller
bind=SUPER,n,switch_layout

# screenshots (grim/slurp; region opens satty). See scripts/screenshot.sh.
bind=NONE,Print,spawn_shell,$HOME/.config/mango/scripts/screenshot.sh full
bind=SUPER+SHIFT,s,spawn_shell,$HOME/.config/mango/scripts/screenshot.sh region --edit
bind=SUPER+SHIFT,Print,spawn_shell,$HOME/.config/mango/scripts/screenshot.sh window

# volume and brightness (locked so they work while the session is locked)
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-

# media keys
bind=NONE,XF86AudioNext,spawn,playerctl next
# XF86AudioPlay and XF86AudioPause resolve to the same keycode, so bind only
# one of them (0.18.2 flags the pair as a conflict); both ran play-pause.
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous

# mouse: Super+drag moves/resizes
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Super+scroll walks to the previous/next tag that has a client
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# three-finger horizontal swipe, same tag walk — swipe left moves to the
# tag on the right (content follows the fingers, like Hyprland's gesture)
gesturebind=none,left,3,viewtoright_have_client
gesturebind=none,right,3,viewtoleft_have_client

# ── resize keymode (Super+Shift+R enters; Escape leaves) ────────────────
bind=SUPER+SHIFT,r,setkeymode,resize
key_mode=resize
bind=NONE,h,resizewin,-50,+0
bind=NONE,l,resizewin,+50,+0
bind=NONE,k,resizewin,+0,-50
bind=NONE,j,resizewin,+0,+50
bind=NONE,Escape,setkeymode,default
key_mode=default

# ── window and layer rules ──────────────────────────────────────────────
# Swallow (hiding a terminal while a GUI launched from it is open) is opt-in:
# mango only treats a client as a terminal when it carries is_term:1, and
# nothing else sets that flag. No rule here grants it, so launching a GUI
# leaves the terminal alone. Re-enabling means restoring one rule per terminal
# app id (ids mirror the keyd terminal list, nix/modules/features/keyd/nixos.nix) *and*
# reopening the terminals — reload_config does not re-apply rules to running
# clients, so an already-open terminal keeps is_term until it exits:
#window_rule=is_term:1,app_id:^(foot|org\.codeberg\.dnkl\.foot|alacritty|Alacritty|kitty|com\.mitchellh\.ghostty|org\.wezfurlong\.wezterm)$

# Float the Steam Settings dialog; the main Steam window is unaffected.
window_rule=is_floating:1,app_id:^steam$,title:^Steam Settings$

# Rofi: no layer animation at all. animation_type_open/close:none only stops
# open/close, but rofi re-sizes as you type, and that resize animation made it
# fly in from the wrong edge. no_animation kills open, close and resize.
layer_rule=no_animation:1,layer_name:^rofi$

# ── per-host overrides (monitor rules) ──────────────────────────────────
source-optional=~/.config/mango/host.conf
