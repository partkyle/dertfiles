# Mango (mangowc) main config.
#
# Live-linked into ~/.config/mango by nix/modules/mango.nix, so saving this
# file hot-reloads the compositor.
#
# Option names target the nixpkgs package (0.17.2); the upstream docs describe
# a newer release and use different spellings (e.g. tagrule vs tag_rule).
# Values follow the shipped 0.17.2 default unless a comment says otherwise.
# Per-host monitor rules live in host.conf, sourced at the bottom.

# ── appearance (0.17.2 defaults) ────────────────────────────────────────
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

shadows=0
layer_shadows=0
shadow_only_floating=1
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller layout
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-stack layout
new_is_master=1
default_mfact=0.55
default_nmaster=1

# Dwindle layout
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overviewgappi=5
overviewgappo=30
overcircle_center_ratio=0.5

# Misc
tag_num=9
smartgaps=0
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
idleinhibit_when_fullscreen=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focusdir_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# Keyboard / input
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us
xkb_rules_options=ctrl:nocaps

# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# Mouse
mouse_natural_scrolling=0

# Gaps and borders
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=4
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# ── tags ────────────────────────────────────────────────────────────────
# All nine tags start in the master-stack (tile) layout. `dert mango layout`
# switches the focused tag's layout at runtime.
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Layouts Super+n cycles through.
circle_layout=dwindle,tile,monocle,scroller

# ── keybindings ─────────────────────────────────────────────────────────
# Super chords drive the focused app's own clipboard/select-all via keyd
# (nix/modules/keyd.nix), so Super+A/X/C/V/T/W never reach the compositor.
# Super+Shift+C is re-asserted by keyd for centerwin.

# reload config
bind=SUPER,r,reload_config

# launcher, terminal, files, browser
bind=SUPER,space,spawn,rofi -show drun -show-icons
bind=SUPER,Return,spawn,foot
bind=SUPER,e,spawn,foot -e yazi
bind=SUPER,b,spawn,brave

# quit
bind=SUPER+SHIFT,m,quit

# window state
bind=SUPER,q,killclient
bind=SUPER,g,togglefloating
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,f,togglefakefullscreen
bind=SUPER+SHIFT,c,centerwin

# focus
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# move window
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,l,move_client,right
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down

# tags 1-9: view, and move the focused window
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# scratchpad (standard, Sway-like)
bind=SUPER,grave,toggle_scratchpad
bind=SUPER+SHIFT,grave,minimized
bind=SUPER+SHIFT,i,restore_minimized

# layouts: quick switches go through dert so the bar records the mode
bind=SUPER,m,spawn_shell,$HOME/.local/bin/dert mango layout monocle
bind=SUPER,comma,spawn_shell,$HOME/.local/bin/dert mango layout dwindle
bind=SUPER,period,spawn_shell,$HOME/.local/bin/dert mango layout tile
bind=SUPER,slash,spawn_shell,$HOME/.local/bin/dert mango layout scroller
bind=SUPER,n,switch_layout

# screenshots (grim/slurp; region opens satty). See scripts/screenshot.sh.
bind=NONE,Print,spawn_shell,$HOME/.config/mango/scripts/screenshot.sh full
bind=SUPER+SHIFT,s,spawn_shell,$HOME/.config/mango/scripts/screenshot.sh region --edit
bind=SUPER+SHIFT,Print,spawn_shell,$HOME/.config/mango/scripts/screenshot.sh window

# volume and brightness (locked so they work while the session is locked)
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-

# media keys
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPause,spawn,playerctl play-pause
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPrev,spawn,playerctl previous

# mouse: Super+drag moves/resizes
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Super+scroll walks to the previous/next tag that has a client
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# three-finger horizontal swipe, same tag walk
gesturebind=none,left,3,viewtoleft_have_client
gesturebind=none,right,3,viewtoright_have_client

# ── resize keymode (Super+Shift+R enters; Escape leaves) ────────────────
bind=SUPER+SHIFT,r,setkeymode,resize
keymode=resize
bind=NONE,h,resizewin,-50,+0
bind=NONE,l,resizewin,+50,+0
bind=NONE,k,resizewin,+0,-50
bind=NONE,j,resizewin,+0,+50
bind=NONE,Escape,setkeymode,default
keymode=default

# ── window and layer rules ──────────────────────────────────────────────
# Float the Steam Settings dialog; the main Steam window is unaffected.
windowrule=isfloating:1,appid:^steam$,title:^Steam Settings$

# Rofi: instant open/close, no animation.
layerrule=animation_type_open:none,layer_name:^rofi$
layerrule=animation_type_close:none,layer_name:^rofi$

# ── per-host overrides (monitor rules) ──────────────────────────────────
source-optional=~/.config/mango/host.conf
