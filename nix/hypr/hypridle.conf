# hypridle config
# Lock after 120s, display sleep after 300s of inactivity.
#
# Both listeners gate themselves on idle-inhibit.sh `check` (hypridle's
# condition_cmd): while the bar's lock icon has idle actions inhibited the
# condition fails and hypridle retries every minute, so the machine locks as
# soon as the inhibit expires - even if it stayed idle throughout.

general {
    lock_cmd = pidof hyprlock || hyprlock
}

listener {
    timeout = 120
    # `pidof` guard: without it every timeout fire spawns another hyprlock.
    # Only one hyprlock can hold the session lock, so the rest never receive
    # the unlock event and hang around permanently (leaked ~165 MB each).
    on-timeout = pidof hyprlock || hyprlock
    condition_cmd = $HOME/.config/hypr/scripts/idle-inhibit.sh check
    condition_retry = 60
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    condition_cmd = $HOME/.config/hypr/scripts/idle-inhibit.sh check
    condition_retry = 60
}
