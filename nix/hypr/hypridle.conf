# hypridle config
# Lock after 120s, display sleep after 300s of inactivity.
#
# Both listeners gate themselves on idle-inhibit.sh `check` (hypridle's
# condition_cmd): while the bar's lock icon has idle actions inhibited the
# condition fails and hypridle retries every minute, so the machine locks as
# soon as the inhibit expires - even if it stayed idle throughout.

general {
    lock_cmd = pidof swaylock || swaylock
}

listener {
    timeout = 120
    # `pidof` guard: without it every timeout fire spawns another swaylock.
    # Only one swaylock can hold the session lock; the rest exit immediately
    # or hang around without receiving the unlock event.
    on-timeout = pidof swaylock || swaylock
    condition_cmd = $HOME/.config/hypr/scripts/idle-inhibit.sh check
    condition_retry = 60
}

listener {
    timeout = 300
    on-timeout = $HOME/.config/hypr/scripts/dpms.sh off
    on-resume  = $HOME/.config/hypr/scripts/dpms.sh on
    condition_cmd = $HOME/.config/hypr/scripts/idle-inhibit.sh check
    condition_retry = 60
}
