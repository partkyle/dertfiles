# swayidle config
# Lock after 120s, display sleep after 300s of inactivity.
#
# idle-action.sh enforces the keep-awake stamp: while it is active the timeout
# action defers until the stamp expires. The resume action cancels pending
# deferrals and wakes the outputs.

timeout 120 '$HOME/.config/idle/scripts/idle-action.sh lock' resume '$HOME/.config/idle/scripts/idle-action.sh resume'
timeout 300 '$HOME/.config/idle/scripts/idle-action.sh dpms-off' resume '$HOME/.config/idle/scripts/idle-action.sh resume'
before-sleep '$HOME/.config/idle/scripts/idle-action.sh sleep'
