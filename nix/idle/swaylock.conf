# swaylock-effects config — Catppuccin Mocha.
#
# Deployed as ~/.config/swaylock/config by nix/modules/desktop-idle.nix and used
# by every session (Hyprland and mango). The effects fork keeps the clock/date
# and background blur from the previous lock screen.

# Background (pre-shaded wallpaper, blurred again by the locker)
image=~/.config/backgrounds/shaded.png
scaling=fill
color=1e1e2e
effect-blur=7x2

# Indicator. Swaylock only has a circular password indicator (no input field
# or password dots); each keypress paints a 60° arc on the ring, and backspace
# paints a different one. Keep the text small enough to fit inside.
indicator
clock
timestr=%R
datestr=%a, %d %b %Y
font=Maple Mono NF
indicator-radius=150
indicator-thickness=6
font-size=48
hide-keyboard-layout

# Colors from Catppuccin's official swaylock port (Mocha):
# https://github.com/catppuccin/swaylock/blob/main/themes/mocha.conf
bs-hl-color=f5e0dc
caps-lock-bs-hl-color=f5e0dc
caps-lock-key-hl-color=a6e3a1
inside-color=1e1e2e
inside-clear-color=1e1e2e
inside-caps-lock-color=1e1e2e
inside-ver-color=1e1e2e
inside-wrong-color=1e1e2e
layout-bg-color=00000000
layout-border-color=00000000
layout-text-color=cdd6f4
line-color=00000000
line-clear-color=00000000
line-caps-lock-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
ring-color=313244
ring-clear-color=f5e0dc
ring-caps-lock-color=fab387
ring-ver-color=89b4fa
ring-wrong-color=eba0ac
separator-color=00000000
text-color=cdd6f4
text-clear-color=f5e0dc
text-caps-lock-color=fab387
text-ver-color=89b4fa
text-wrong-color=eba0ac

# Typing feedback: each keypress paints a green arc on the surface0 ring,
# backspace paints rosewater, and the Caps Lock text turns peach.
key-hl-color=a6e3a1
