# Herdr wrote this on first launch; kept deliberately so the onboarding flow
# never appears again (and never tries to rewrite a read-only config).
onboarding = false
# Herdr config. Deployed as a live link to the repo by nix/modules/herdr.nix,
# because Herdr writes this file itself (onboarding, in-app settings, channel)
# and a read-only store copy would make those writes fail.
#
# Only the tmux bindings that are actually used are mapped; everything else
# stays on Herdr's defaults. Reload after editing:
#   herdr server reload-config
#
# Prefix is ctrl+b. Every prefix binding keeps ctrl held, matching tmux's
# `bind-key C-c` style — press ctrl+b, keep ctrl down, press the action key:
#   ctrl+c            new tab            (tmux C-c new-window)
#   ctrl+n / ctrl+p   next / previous tab
#   ctrl+1..9         jump to tab
#   ctrl+w            workspace picker
#   ctrl+f            goto picker        (all panes/agents; replaces find-window)
#   ctrl+v / ctrl+s   split right / down (tmux C-v / C-s)
#   ctrl+h/j/k/l      focus pane
#   ctrl+x / ctrl+z   close pane / zoom pane
#   ctrl+q            detach
#   ctrl+shift+s      settings           (ctrl+s is taken by split down)

[ui]
# prefix+ctrl+c should create the tab immediately instead of opening a name
# prompt.
prompt_new_tab_name = false

[keys]
prefix = "ctrl+b"

# Create and switch tabs.
new_tab = "prefix+ctrl+c"
next_tab = "prefix+ctrl+n"
previous_tab = "prefix+ctrl+p"
switch_tab = "prefix+ctrl+1..9"
workspace_picker = "prefix+ctrl+w"
goto = "prefix+ctrl+f"

# Create and manage panes.
split_vertical = "prefix+ctrl+v"
split_horizontal = "prefix+ctrl+s"
focus_pane_left = "prefix+ctrl+h"
focus_pane_down = "prefix+ctrl+j"
focus_pane_up = "prefix+ctrl+k"
focus_pane_right = "prefix+ctrl+l"
close_pane = "prefix+ctrl+x"
zoom = "prefix+ctrl+z"

# Herdr defaults kept deliberately: prefix+? help, prefix+shift+n new
# workspace, prefix+shift+x close tab.
detach = "prefix+ctrl+q"

# Move the settings dialog off ctrl+s, which now splits down.
settings = "prefix+ctrl+shift+s"
